<template id="passport-stamp-template">

<div class="passport-entry">

    <div class="passport-entry__stamp">

        <div class="passport-entry__seal">

            <span class="passport-entry__flag"></span>

        </div>

        <p class="passport-entry__visa">

            ENTRY VISA

        </p>

        <h3 class="passport-entry__country"></h3>

        <p class="passport-entry__issue">

            ISSUE 001

        </p>

        <p class="passport-entry__mission">

            Taste the World

        </p>

        <p class="passport-entry__status">

            ✓ VISITED

        </p>

    </div>

</div>

</template>
