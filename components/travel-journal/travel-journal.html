<template id="travel-journal-template">

<article class="travel-journal">

    <div class="travel-journal__cover">

        <span class="travel-journal__day">

            JOURNAL ENTRY 001

        </span>

        <h2 class="travel-journal__city">

            New Orleans

        </h2>

        <p class="travel-journal__state">

            Louisiana

        </p>

    </div>

    <img
        class="travel-journal__photo"
        src=""
        alt="">

    <section class="travel-journal__details">

        <div class="travel-detail">

            📍

            <span class="travel-stop">

                French Quarter

            </span>

        </div>

        <div class="travel-detail">

            💰

            <span class="travel-budget">

            </span>

        </div>

            🕒

            <span class="travel-days">

                2 Days

            </span>

        </div>

    </section>

    <section class="travel-journal__description">

        <p class="travel-description">

        </p>

    </section>

        Open Journal

    </button>

</template>
