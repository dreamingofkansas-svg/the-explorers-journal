<!-- =========================================================
     Explorer Card Template
========================================================= -->

<template id="explorer-card-template">

<article class="explorer-card">

    <div class="explorer-card__stamp"></div>

    <div class="explorer-card__photo-wrapper">

        <img
            class="explorer-card__photo"
            src=""
            alt="">

        <div class="explorer-card__badge">

            <span class="explorer-card__number">
            </span>

        </div>

    </div>

    <div class="explorer-card__content">

        <h3 class="explorer-card__title">
        </h3>

        <p class="explorer-card__country">
        </p>

        <div class="explorer-card__rule">
        </div>

        <p class="explorer-card__question">
            Would you try this?
        </p>

        <div class="explorer-card__votes">

            <button class="vote vote--yes" data-vote="yes">
                👍 YES
            </button>

            <button class="vote vote--maybe" data-vote="maybe">
                🤔 MAYBE
            </button>

            <button class="vote vote--no" data-vote="no">
                🙅 NO
            </button>

        </div>

        <footer class="explorer-card__footer">

            Explorer Society Collection

        </footer>

    </div>

</article>

</template>
